name: Deploy

# Publishes the dApp to GitHub Pages on every push to master, which is what
# gives the project a live demo URL rather than a "run it locally" README.
#
# Only the frontend is deployed. The contract is not redeployed from CI, and
# deliberately so: deploying spends real (test) funds and would require the
# wallet seed as a repository secret. A deployment is a decision somebody
# makes, not a side effect of merging.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages needs these. `id-token` is what lets the deploy step prove to GitHub
# that the artifact came from this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one mid-flight: a half-finished
# Pages publish leaves the site broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the dApp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # Pages serves this site from a subpath, so assets have to be
        # requested relative to it rather than from the domain root.
        env:
          VITE_BASE: /mn/
          VITE_NETWORK_ID: ${{ vars.VITE_NETWORK_ID || 'preview' }}
          VITE_CONTRACT_ADDRESS: ${{ vars.VITE_CONTRACT_ADDRESS }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
