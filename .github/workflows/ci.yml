name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Compile circuits and run contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Install the Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select the compiler version
        run: |
          compact update
          compact --version
          compact compile --version

      - name: Install dependencies
        working-directory: contract
        run: npm ci

      # Compiling from source in CI is the point: it proves the committed
      # managed/ artifacts are reproducible from gatekeeper.compact, rather
      # than trusting whatever happens to be checked in.
      - name: Compile the contract
        working-directory: contract
        run: npm run compact

      - name: Typecheck
        working-directory: contract
        run: npm run typecheck

      - name: Test
        working-directory: contract
        run: npm test

# A `frontend` job belongs here too, and returns in the next cycle. It is
# deliberately absent for now: the dApp is still only its wallet-connector and
# configuration modules, with no entry point to build, so the job could only
# ever fail. A pipeline that is red for a known, uninteresting reason has
# stopped being a signal, and the contract job above is the one that must hold.
